<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouvrir Sessio</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 420px; }
    h1 { margin-bottom: 12px; }
    p { color: #bbb; line-height: 1.5; }
    a {
      display: block;
      margin-top: 14px;
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }
    .play { background: #5eff9a; color: #000; }
    .apple { background: #fff; color: #000; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Ouvrir Sessio</h1>
    <p>Si Sessio est installé, ce lien peut ouvrir directement l’application.</p>

    <a class="play"
       href="https://play.google.com/store/apps/details?id=com.tymike94.sessio">
      Télécharger sur Android
    </a>

    <a class="apple"
       href="https://apps.apple.com/fr/app/sessio-carnet-de-musculation/id6769478512">
      Télécharger sur iPhone
    </a>
  </div>
</body>
</html>
